<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D/s & S/M パーソナリティ診断</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkBg: '#09090b',
            cardBg: '#121216',
            accentPink: '#ec4899',
            accentPurple: '#8b5cf6',
            accentRed: '#f43f5e'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .glass-card {
      background: rgba(18, 18, 22, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .gradient-text {
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-pink-500 selection:text-white">

  <div class="w-full max-w-md mx-auto">
    <!-- スタート画面 -->
    <div id="start-screen" class="glass-card rounded-3xl p-8 text-center shadow-2xl">
      <div class="inline-block px-3 py-1 mb-4 text-xs font-semibold tracking-wider text-pink-400 uppercase bg-pink-500/10 rounded-full border border-pink-500/20">
        10 Questions Test
      </div>
      <h1 class="text-3xl font-extrabold mb-3 tracking-tight">
        <span class="gradient-text">ドミ・サブ・S・M</span><br>気質＆相性診断
      </h1>
      <p class="text-zinc-400 text-sm mb-8 leading-relaxed">
        10問の質問に直感で答えるだけで、あなたの「ドミナント（支配）」「サブミッシブ（服従）」「サディスト（加虐）」「マゾヒスト（被虐）」の割合と、相性の良いタイプを分析します。
      </p>
      <button onclick="startQuiz()" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-bold text-lg shadow-lg shadow-pink-600/25 transition-all active:scale-95">
        診断をはじめる
      </button>
    </div>

    <!-- 質問画面 -->
    <div id="quiz-screen" class="hidden glass-card rounded-3xl p-6 sm:p-8 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <span id="question-number" class="text-xs font-bold text-pink-400 tracking-wider">QUESTION 1 / 10</span>
        <span id="progress-text" class="text-xs text-zinc-500">10%</span>
      </div>
      <div class="w-full bg-zinc-800 h-1.5 rounded-full mb-8 overflow-hidden">
        <div id="progress-bar" class="bg-gradient-to-r from-pink-500 to-purple-500 h-full transition-all duration-300" style="width: 10%"></div>
      </div>

      <h2 id="question-text" class="text-xl font-bold mb-8 leading-snug min-h-[3.5rem]">
        質問文がここに入ります
      </h2>

      <div class="space-y-3">
        <button onclick="answerQuestion(2)" class="w-full py-3.5 px-4 rounded-xl bg-zinc-800/80 hover:bg-pink-600/20 border border-zinc-700 hover:border-pink-500/50 text-left font-medium transition-all flex items-center justify-between group">
          <span>非常に当てはまる</span>
          <span class="w-4 h-4 rounded-full border border-zinc-500 group-hover:border-pink-400"></span>
        </button>
        <button onclick="answerQuestion(1)" class="w-full py-3.5 px-4 rounded-xl bg-zinc-800/80 hover:bg-pink-600/20 border border-zinc-700 hover:border-pink-500/50 text-left font-medium transition-all flex items-center justify-between group">
          <span>やや当てはまる</span>
          <span class="w-4 h-4 rounded-full border border-zinc-500 group-hover:border-pink-400"></span>
        </button>
        <button onclick="answerQuestion(0)" class="w-full py-3.5 px-4 rounded-xl bg-zinc-800/80 hover:bg-zinc-700 border border-zinc-700 text-left font-medium text-zinc-300 transition-all flex items-center justify-between group">
          <span>どちらともいえない</span>
          <span class="w-4 h-4 rounded-full border border-zinc-500"></span>
        </button>
        <button onclick="answerQuestion(-1)" class="w-full py-3.5 px-4 rounded-xl bg-zinc-800/80 hover:bg-purple-600/20 border border-zinc-700 hover:border-purple-500/50 text-left font-medium transition-all flex items-center justify-between group">
          <span>あまり当てはまらない</span>
          <span class="w-4 h-4 rounded-full border border-zinc-500 group-hover:border-purple-400"></span>
        </button>
        <button onclick="answerQuestion(-2)" class="w-full py-3.5 px-4 rounded-xl bg-zinc-800/80 hover:bg-purple-600/20 border border-zinc-700 hover:border-purple-500/50 text-left font-medium transition-all flex items-center justify-between group">
          <span>全く当てはまらない</span>
          <span class="w-4 h-4 rounded-full border border-zinc-500 group-hover:border-purple-400"></span>
        </button>
      </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="hidden glass-card rounded-3xl p-6 sm:p-8 shadow-2xl">
      <div class="text-center mb-6">
        <span class="text-xs font-bold tracking-widest text-zinc-400 uppercase">DIAGNOSIS RESULT</span>
        <h2 id="result-title" class="text-2xl sm:text-3xl font-extrabold mt-1 gradient-text">
          タイプ名
        </h2>
        <p id="result-subtitle" class="text-xs text-zinc-400 mt-1">サブタイトル</p>
      </div>

      <!-- 4つの割合バー -->
      <div class="space-y-4 mb-6 bg-zinc-900/60 p-5 rounded-2xl border border-zinc-800">
        <div>
          <div class="flex justify-between text-sm font-bold mb-1">
            <span class="text-pink-400">ドミナント (Dom / 支配)</span>
            <span id="score-dom">0%</span>
          </div>
          <div class="w-full bg-zinc-800 h-2.5 rounded-full overflow-hidden">
            <div id="bar-dom" class="bg-pink-500 h-full rounded-full transition-all duration-700" style="width: 0%"></div>
          </div>
        </div>

        <div>
          <div class="flex justify-between text-sm font-bold mb-1">
            <span class="text-purple-400">サブミッシブ (Sub / 服従)</span>
            <span id="score-sub">0%</span>
          </div>
          <div class="w-full bg-zinc-800 h-2.5 rounded-full overflow-hidden">
            <div id="bar-sub" class="bg-purple-500 h-full rounded-full transition-all duration-700" style="width: 0%"></div>
          </div>
        </div>

        <div>
          <div class="flex justify-between text-sm font-bold mb-1">
            <span class="text-rose-400">サディスト (S / 加虐)</span>
            <span id="score-s">0%</span>
          </div>
          <div class="w-full bg-zinc-800 h-2.5 rounded-full overflow-hidden">
            <div id="bar-s" class="bg-rose-500 h-full rounded-full transition-all duration-700" style="width: 0%"></div>
          </div>
        </div>

        <div>
          <div class="flex justify-between text-sm font-bold mb-1">
            <span class="text-indigo-400">マゾヒスト (M / 被虐)</span>
            <span id="score-m">0%</span>
          </div>
          <div class="w-full bg-zinc-800 h-2.5 rounded-full overflow-hidden
